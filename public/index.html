<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create | Nail Set Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <!-- ===== Nav bar ===== -->
  <nav class="nav">
    <a class="brand" href="index.html">
      <img class="brand-logo logo-light" src="logo.svg" alt="Nail Set Designer">
      <img class="brand-logo logo-dark" src="logo-dark.svg" alt="Nail Set Designer">
    </a>
    <div class="nav-links">
      <a href="index.html" class="active">Create</a>
      <a href="saved.html">Saved Designs</a>
      <button type="button" class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Dark mode">
        <span class="theme-label" aria-hidden="true">Dark mode</span>
        <span class="theme-track" aria-hidden="true">
          <span class="theme-knob">
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </span>
        </span>
      </button>
    </div>
  </nav>

  <main>
    <!-- ===== Title (click to rename) ===== -->
    <div class="page-head">
      <label class="title-edit">
        <input id="set-name" class="title-input" type="text" value="Name design" aria-label="Design name">
        <svg class="edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
      </label>
      <p class="page-sub">Create and save your nail designs!</p>
    </div>

    <div class="studio">
      <!-- ===== Left: the hand ===== -->
      <section class="card canvas">
        <div class="view-toggle" role="group" aria-label="Show one hand or both hands">
          <button type="button" data-view="one">One hand</button>
          <button type="button" data-view="both">Both hands</button>
        </div>
        <svg id="hand" role="img" aria-label="Your nail design. Click a nail to edit it on its own."></svg>
        <button type="button" class="pill reset-btn" id="reset">Reset</button>
        <div class="skin-tones">
          <p>Skin Tone</p>
          <div class="swatches" id="skin-tones"></div>
        </div>
      </section>

      <!-- ===== Right: Customize your set ===== -->
      <section class="card panel">
        <h2>Customize your set</h2>

        <div class="section">
          <h3>Editing</h3>
          <div class="pills" id="nail-picker"></div>
        </div>

        <div class="section">
          <h3>01:&nbsp; Shape</h3>
          <div class="pills" data-option="shape"></div>
        </div>

        <div class="section">
          <h3>02:&nbsp; Base color</h3>
          <div class="swatches" id="colours"></div>
          <label class="pill picker-pill">
            Colour Picker
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg>
            <input id="colour-picker" type="color" value="#d8a99d" aria-label="Choose any colour">
          </label>
        </div>

        <div class="section">
          <h3>03:&nbsp; Finish</h3>
          <div class="pills" data-option="finish"></div>
        </div>

        <div class="section">
          <h3>04:&nbsp; Length</h3>
          <div class="pills" data-option="length"></div>
        </div>

        <div class="your-set">
          <h3>Your set:</h3>
          <div class="pills" id="summary"></div>
        </div>

        <div class="panel-foot">
          <button class="save-btn" id="save">Save</button>
          <p class="status" id="status">Not saved yet</p>
        </div>
      </section>
    </div>
  </main>

  <script src="hand.js"></script>
  <script src="popup.js"></script>
  <script src="studio.js"></script>
</body>
</html>
